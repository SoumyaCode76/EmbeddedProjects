[platformio]
default_envs = esp8266_nodemcu, esp32_nodemcud

; Shared options used by all targets
[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -Isrc
    -Iinclude
    -Ilib
lib_ldf_mode = chain+

; ESP8266 environment
[env:esp8266_nodemcu]
platform = espressif8266
board = nodemcuv2
build_flags =
    ${env.build_flags}
    -D TARGET_ESP8266

; ESP32 environment
[env:esp32_nodemcu]
platform = espressif32
board = nodemcu-32s
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -D TARGET_ESP32
