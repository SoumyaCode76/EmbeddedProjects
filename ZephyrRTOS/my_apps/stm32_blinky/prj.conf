# Zephyr Project Configuration for STM32 Blinky

# Enable GPIO driver
CONFIG_GPIO=y

# Enable LED support
CONFIG_LED=y

# Enable console for debugging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Enable serial
CONFIG_SERIAL=y

# Enable printk for debugging
CONFIG_PRINTK=y

# Optimize for size
CONFIG_SIZE_OPTIMIZATIONS=y

# Board specific configurations
CONFIG_BOARD_STM32F429I_DISC1=y